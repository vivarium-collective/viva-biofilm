name: competition
description: |
  2D RS-vs-YS multi-strategy competition (Cockx et al. 2024 Fig. 5
  reproduction): two coccoid bacterial strategies — a Rate Strategist (higher
  mu_max, lower yield) and a Yield Strategist (lower mu_max, higher yield) —
  competing over a single shared oxygen substrate via reaction-diffusion PDE +
  agent shoving + division + detachment. Uses the same BiofilmProcess as the
  single-species biofilm composite; the `strategies` block in its spec routes
  through the engine's per-species kinetics path instead of the single-species
  one. Default spec below seeds 10 agents of each strategy (see
  viva_biofilm.run.competition_spec for the density sweep this study runs at
  5/10/50 per strategy).
tags: [biofilm, competition, idynomics2, reproduction, rust, cockx2024]
requires:
  processes: [BiofilmProcess]
state:
  competition:
    _type: process
    address: "local:BiofilmProcess"
    config:
      dt_per_update: 0.041666666666666664
      spec:
        domain: {nx: 128, ny: 64, dx: 1.5625, layer_thickness: 40.0}
        solutes:
        - {name: oxygen, init: 1.0, diff_liquid: 2000.0, diff_biofilm: 2000.0, bulk: 1.0}
        strategies:
        - name: RS
          density: 0.1363
          division_mass: 0.08
          mu_max: 3.9398
          monod: [[oxygen, 0.6]]
          yields: [[oxygen, -43.478]]
          spawn_n: 10
          seed_offset: 0
        - name: YS
          density: 0.1363
          division_mass: 0.08
          mu_max: 1.9699
          monod: [[oxygen, 0.3]]
          yields: [[oxygen, -21.739]]
          spawn_n: 10
          seed_offset: 1
        seed: 42
    inputs:
      boundary_concentrations: [stores, boundary_concentrations]
    outputs:
      average_concentrations: [stores, average_concentrations]
      population: [stores, population]
      time: [stores, time]
      total_biomass: [stores, total_biomass]
      biofilm_thickness: [stores, biofilm_thickness]
      agent_positions: [stores, agent_positions]
      agent_masses: [stores, agent_masses]
      agent_radii: [stores, agent_radii]
      agent_species: [stores, agent_species]
      solute_fields: [stores, solute_fields]
      grid_shape: [stores, grid_shape]
    interval: 0.041666666666666664
  stores:
    boundary_concentrations: {}
    average_concentrations: {}
    population: 0.0
    time: 0.0
    total_biomass: 0.0
    biofilm_thickness: 0.0
    agent_positions: []
    agent_masses: []
    agent_radii: []
    agent_species: []
    solute_fields: {}
    grid_shape: []
