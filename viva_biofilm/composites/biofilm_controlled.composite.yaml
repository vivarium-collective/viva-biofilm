name: biofilm_controlled
description: |
  Couples a BoundaryControllerProcess to the standard BiofilmProcess: the
  controller drives the oxygen boundary concentration on a fixed day
  schedule (drop at t=1d, restore at t=3d) through a shared
  boundary_concentrations store, demonstrating runtime environmental control
  via the Rust set_bulk_by_name hook (Task 6) without touching biofilm
  internals -- composability of viva-biofilm processes with process-bigraph.
tags: [biofilm, composability, controller, rust]
requires:
  processes: [BoundaryControllerProcess, BiofilmProcess]
state:
  controller:
    _type: process
    address: "local:BoundaryControllerProcess"
    config:
      solute: oxygen
      schedule:
      - [0.0, 8.74]
      - [1.0, 0.5]
      - [3.0, 8.74]
    inputs: {}
    outputs:
      boundary_concentrations: [stores, boundary_concentrations]
    interval: 0.05
  biofilm:
    _type: process
    address: "local:BiofilmProcess"
    config:
      dt_per_update: 0.05
      spec:
        domain: {nx: 16, ny: 32, dx: 2.0, layer_thickness: 32.0}
        solutes:
        - {name: solute, init: 1.0, diff_liquid: 2000.0, diff_biofilm: 1500.0, bulk: 1.0}
        - {name: oxygen, init: 8.74, diff_liquid: 2000.0, diff_biofilm: 1500.0, bulk: 8.74}
        reactions:
        - {mu_max: 2.05, monod: [[solute, 2.4], [oxygen, 0.6]], yields: [[solute, -4.2], [oxygen, -18.0]]}
        species: {density: 0.15, division_mass: 0.2}
        spawn: {n: 30, band_height: 1.0, seed_offset: 0}
        seed: 1234
    inputs:
      boundary_concentrations: [stores, boundary_concentrations]
    outputs:
      average_concentrations: [stores, average_concentrations]
      population: [stores, population]
      time: [stores, time]
      total_biomass: [stores, total_biomass]
      biofilm_thickness: [stores, biofilm_thickness]
      agent_positions: [stores, agent_positions]
      agent_masses: [stores, agent_masses]
      agent_radii: [stores, agent_radii]
      agent_species: [stores, agent_species]
      solute_fields: [stores, solute_fields]
      grid_shape: [stores, grid_shape]
    interval: 0.05
  stores:
    boundary_concentrations: {}
    average_concentrations: {}
    population: 0.0
    time: 0.0
    total_biomass: 0.0
    biofilm_thickness: 0.0
    agent_positions: []
    agent_masses: []
    agent_radii: []
    agent_species: []
    solute_fields: {}
    grid_shape: []
