schema_version: 4
name: composability
investigation: viva-biofilm-capabilities
title: "Composability: a boundary controller process perturbing the biofilm at runtime"
created: '2026-07-31'
status: complete
question: |
  Does viva-biofilm's boundary_concentrations runtime hook (the Task 6
  set_bulk_by_name binding) actually compose with an external
  process-bigraph control process -- can a BoundaryControllerProcess drive
  the biofilm's oxygen boundary on a schedule and produce a visible,
  measurable growth response, the same way process-bigraph composes any two
  processes sharing a store?
report:
  title: Composability
  verdict: pass
  confidence: high
  evidence_quality: deterministic paired run (fixed seed for both perturbed and control arms, no statistical repeats)
  objective: |
    Couple a new BoundaryControllerProcess to BiofilmProcess via a shared
    boundary_concentrations store, drive oxygen down at t=1d and restore it
    at t=3d over a 4-day run, and compare against an identically-seeded
    un-perturbed control to demonstrate that the biofilm's growth responds
    to a runtime, externally-driven environmental perturbation.
  result: |
    The controller followed its schedule exactly: oxygen boundary held at
    0.5 g/m^3 (reference 0.5) through the t=1d-3d low window and restored to
    8.74 g/m^3 (reference 8.74) after. Over the same 4-day, same-seed window,
    the perturbed biofilm's growth was visibly suppressed relative to the
    control: final population 60 vs. 120 agents, final total biomass 11.58
    pg vs. 20.08 pg (biomass ratio 0.577) -- a clear, measurable response to
    the runtime boundary perturbation.
  interpretation: |
    The Task 6 runtime boundary hook and the Task 7 controller process
    compose exactly the way any two process-bigraph processes sharing a
    store should: no biofilm-internal code changed, yet an external process
    can meaningfully steer the simulation's environment and produce a
    biologically sensible response (oxygen limitation slows growth). This
    demonstrates viva-biofilm's composability with process-bigraph beyond
    the single-process biofilm/chemostat composites.
study_card:
  phase: Simulate / Evaluate
  one_liner: "Controller-driven oxygen dip -> 60 vs 120 final agents (control); biomass ratio 0.577."
  status: complete
  reproduces: "viva-native capability (runtime process control) — not a paper-figure reproduction"
  headline: "viva capability (no paper figure). — PASS: controller drove the boundary exactly, biofilm growth visibly responded."
conditions:
  baseline:
    composite: viva_biofilm.composites.biofilm_controlled.biofilm_controlled
    params: {}
  variants: []
  model_settings:
  - {name: fixed-params-no-sweep, detail: "seed=1234, dt=0.05, n_steps=80 (4 days); schedule oxygen=[[0,8.74],[1,0.5],[3,8.74]]; control run identical spec/seed with no boundary perturbation"}
tests:
- name: controller-drives-response
  classification: primary
  status: passed
  question: "Does the controller drive the boundary exactly per schedule, and does the biofilm's growth visibly respond (perturbed run below the un-perturbed control)?"
  measure: {kind: report_card_axis, card: workspace/studies/composability/viz/report_card, group: composability}
  pass_if: {op: verdict_at_least, level: within_tol}
visualizations:
- name: response
  address: image:charts/response.html
  config: {title: "Biofilm response", caption: "Population, total biomass, and oxygen boundary vs. time — perturbed vs. control, low-oxygen window shaded"}
- name: colony before perturbation
  address: image:charts/colony_before.html
  config: {title: "Colony before perturbation", caption: "Colony state as the oxygen drop begins (t=1d)"}
- name: colony after perturbation
  address: image:charts/colony_after.html
  config: {title: "Colony after perturbation", caption: "Final colony state (t=4d), after the oxygen boundary restored"}
embed_visualizations:
- name: "Biofilm response (interactive)"
  url: /reports/figures/composability/response.html
  description: Population, total biomass, and oxygen boundary vs. time for the perturbed and control runs, with the low-oxygen window (t=1d-3d) shaded. Hover for exact values.
- name: "Colony before perturbation (interactive)"
  url: /reports/figures/composability/colony_before.html
  description: Colony state at t=1d, the moment the controller starts driving oxygen down.
- name: "Colony after perturbation (interactive)"
  url: /reports/figures/composability/colony_after.html
  description: Final colony state at t=4d, after the oxygen boundary has been restored and growth has resumed.
runs: []
pipeline_gate:
  prerequisites: [spatial-biofilm-growth]
  enables: []
  gate_status: passed
