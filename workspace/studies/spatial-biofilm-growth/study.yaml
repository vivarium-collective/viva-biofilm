schema_version: 4
name: spatial-biofilm-growth
investigation: viva-biofilm-capabilities
title: "Spatial biofilm growth: a developed colony with a real substrate gradient"
created: '2026-07-31'
status: complete
question: |
  Starting from a small inoculum of 40 agents, does the viva-biofilm spatial
  engine grow a visibly developed 2D biofilm — hundreds of agents, a
  measurable thickness above the substratum, and a genuine substrate-limitation
  gradient (boundary richer than substratum) — within a short, deterministic,
  non-swept run?
report:
  title: Spatial biofilm growth
  verdict: pass
  confidence: high
  evidence_quality: deterministic single run, fixed parameters (no sweep)
  objective: |
    Demonstrate the viva-biofilm spatial engine's headline capability: a
    developed 2D biofilm colony with realistic spatial structure, rendered as
    interactive figures, anchored by the chemostat-equivalence well-mixed
    validation.
  result: |
    From 40 seed agents, 150 steps (dt=0.05 d) at a 32x48 grid grew the colony
    to 640 agents with a biofilm thickness of 11.7 um. The solute field shows
    a clear substrate-limitation gradient: substratum-third mean 0.438 g/m^3
    vs boundary-third mean 0.894 g/m^3 (ratio 0.49) — the biofilm is
    demonstrably drawing down substrate near the surface it consumes it at.
  interpretation: |
    A small inoculum develops into a spatially structured, substrate-limited
    biofilm using fixed, non-tuned parameters — the qualitative behavior
    iDynoMiCS-2 is designed to reproduce, now visualized interactively and
    reproducibly in seconds rather than minutes.
study_card:
  phase: Simulate / Evaluate
  one_liner: "40 agents -> 640-agent biofilm, 11.7 um thick, with a real substrate gradient."
  status: complete
  headline: "PASS — grown, developed, substrate-limited."
conditions:
  baseline:
    composite: viva_biofilm.composites.biofilm.biofilm
    params: {}
  variants: []
  model_settings:
  - {name: fixed-params-no-sweep, detail: "nx=32, ny=48, n_agents=40, seed=11, n_steps=150, snapshot_every=15, dt=0.05 -- fixed, not tuned"}
tests:
- name: developed-biofilm-structure
  classification: primary
  status: passed
  question: "Does the biofilm grow, develop positive thickness, and show a clear substrate gradient?"
  measure: {kind: report_card_axis, card: workspace/studies/spatial-biofilm-growth/viz/report_card, group: spatial-structure}
  pass_if: {op: verdict_at_least, level: within_tol}
visualizations:
- name: colony (colored by mass)
  address: image:charts/colony_final.html
  config: {title: "Final colony", caption: "Agents colored by mass, true-to-scale radius"}
- name: colony (colored by local substrate)
  address: image:charts/colony_substrate.html
  config: {title: "Final colony — local substrate", caption: "Agents colored by locally sampled substrate concentration"}
- name: substrate field
  address: image:charts/solute_substrate.html
  config: {title: "Substrate field", caption: "Heatmap of the growth-limiting solute at the final step"}
- name: oxygen field
  address: image:charts/solute_oxygen.html
  config: {title: "Oxygen field", caption: "Heatmap of oxygen at the final step"}
- name: colony time-lapse
  address: image:charts/timelapse.html
  config: {title: "Colony time-lapse", caption: "Animated colony growth across snapshots"}
- name: growth curves
  address: image:charts/growth_curves.html
  config: {title: "Growth curves", caption: "Population, total biomass, and biofilm thickness vs. time"}
embed_visualizations:
- name: "Final colony (interactive)"
  url: /reports/figures/spatial-biofilm-growth/colony_final.html
  description: Agents colored by mass, true-to-scale marker radius, with domain box and substratum line. Hover for per-agent radius.
- name: "Final colony by local substrate (interactive)"
  url: /reports/figures/spatial-biofilm-growth/colony_substrate.html
  description: Same colony, colored by locally sampled substrate concentration — shows which agents are substrate-limited.
- name: "Substrate field (interactive)"
  url: /reports/figures/spatial-biofilm-growth/solute_substrate.html
  description: Heatmap of the growth-limiting solute at the final step; hover for per-cell g/m^3.
- name: "Oxygen field (interactive)"
  url: /reports/figures/spatial-biofilm-growth/solute_oxygen.html
  description: Heatmap of oxygen at the final step.
- name: "Colony time-lapse (interactive)"
  url: /reports/figures/spatial-biofilm-growth/timelapse.html
  description: Animated colony growth with play/pause and a time slider.
- name: "Growth curves (interactive)"
  url: /reports/figures/spatial-biofilm-growth/growth_curves.html
  description: Population, total biomass, and biofilm thickness vs. time as shared-x small multiples.
runs: []
pipeline_gate:
  prerequisites: []
  enables: [runtime-and-scaling, composability]
  gate_status: passed
