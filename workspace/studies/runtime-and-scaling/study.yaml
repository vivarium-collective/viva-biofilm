schema_version: 4
name: runtime-and-scaling
investigation: viva-biofilm-capabilities
title: "Runtime and scaling: throughput and scaling curves for the Rust engine"
created: '2026-07-31'
status: complete
question: |
  After the ~23x performance pass and the addition of configurable PDE
  parameters, how does the viva-biofilm engine's wall-time scale with grid
  size, agent population, and run duration -- and what throughput
  (agent-steps/sec) does it sustain?
report:
  title: Runtime and scaling
  verdict: pass
  confidence: high
  evidence_quality: deterministic sweeps (fixed seed per config, no statistical repeats)
  objective: |
    Measure wall-time and throughput across three independent scaling axes
    (grid resolution, initial population, run duration) at fixed, modest
    per-point step counts, and produce interactive scaling curves alongside
    a throughput summary.
  result: |
    Measured AFTER the reaction-diffusion coupling was made to converge
    (~5-7 inner PDE solves per step, under-relaxation w=0.2), which raised
    per-step cost relative to the earlier single-solve engine -- an
    intentional correctness trade (see interpretation). Grid sweep (40
    agents, 40 steps): 0.99 ms/step at 512 cells (16x32) to 16.97 ms/step at
    12288 cells (96x128) -- sub-quadratic growth in cells, no configuration
    slow (<30s threshold; worst case 0.68s). Population sweep (grid 48x64, 40
    steps): 1.13 ms/step at 20 final agents to 8.26 ms/step at 320 final
    agents. Duration sweep (grid 48x64, 40 agents): total wall time 0.086s at
    20 steps to 1.06s at 160 steps; a linear fit of total time vs. steps gives
    R^2=0.987 -- close to linear, with the small deviation because population
    grows via division over a run (40 -> 640 agents over 160 steps), which
    compounds per-step cost as the run lengthens. Peak throughput on this run
    was ~6.0e4 agent-steps/sec (single-threaded, machine-load-dependent);
    the robust, hardware-independent result is the SCALING SHAPE above, not
    the absolute rate.
  interpretation: |
    Scaling is well-behaved: no configuration in any of the three fixed sweeps
    approached the 30s slow threshold (worst case 0.68s for the largest grid).
    Grid and population scaling both show a clear, sub-quadratic cost increase
    with problem size; duration scaling is near-linear (R^2=0.987, the
    deviation a genuine population-growth effect, not noise). Per-step cost is
    HIGHER than the pre-coupling-fix engine because the reaction-diffusion
    sink<->solve now iterates to self-consistency each step instead of using a
    single lagged solve -- the fix that removed a period-2 oxygen limit cycle
    and made the Monod substrate limitation actually bite. This micro-benchmark
    uses gentle kinetics at small fixed scale, so it sees ONLY that per-step
    overhead. For realistic stiff-kinetics workloads the same fix is a large
    NET speedup, not a slowdown: it bounds the otherwise near-exponential
    population (e.g. the RS-vs-YS competition went from unbounded ~10^5 agents
    / killed-after-minutes to ~4k agents / ~12s over the full 21-day horizon),
    because runtime there is dominated by agent count, not per-step PDE cost.
study_card:
  phase: Simulate / Evaluate
  one_liner: "Well-behaved sub-quadratic grid/population scaling + near-linear duration (R^2=0.987), peak ~6e4 agent-steps/sec; per-step cost reflects the converged reaction-diffusion coupling, a net win on realistic (population-bounding) workloads."
  status: complete
  reproduces: "viva-native capability (engine performance/scaling) — not a paper-figure reproduction"
  headline: "viva capability (no paper figure). — PASS: well-scaling; per-step cost is the converged-coupling correctness trade, a large net win at realistic scale."
conditions:
  baseline:
    composite: viva_biofilm.composites.biofilm.biofilm
    params: {}
  variants: []
  model_settings:
  - {name: grid-sweep, detail: "nx,ny in [(16,32),(32,48),(48,64),(64,96),(96,128)], n_agents=40, n_steps=40, dt=0.05"}
  - {name: population-sweep, detail: "grid=48x64, n_agents in [10,20,40,80,160], n_steps=40, dt=0.05"}
  - {name: duration-sweep, detail: "grid=48x64, n_agents=40, n_steps in [20,40,80,160], dt=0.05"}
tests:
- name: throughput-and-scaling-measured
  classification: primary
  status: passed
  question: "Did the engine sustain measurable throughput and produce scaling curves across all three fixed sweep axes without any configuration exceeding the slow threshold?"
  measure: {kind: report_card_axis, card: workspace/studies/runtime-and-scaling/viz/report_card, group: performance}
  pass_if: {op: verdict_at_least, level: within_tol}
visualizations:
- name: grid-size scaling
  address: image:charts/scaling_grid.html
  config: {title: "Grid-size scaling", caption: "Wall time per step vs. number of grid cells (log-log), fixed 40 agents / 40 steps"}
- name: population scaling
  address: image:charts/scaling_population.html
  config: {title: "Population scaling", caption: "Wall time per step vs. final agent count (log-log), fixed 48x64 grid / 40 steps"}
- name: duration scaling
  address: image:charts/scaling_duration.html
  config: {title: "Duration scaling", caption: "Total wall time vs. steps, fixed 48x64 grid / 40 initial agents"}
- name: throughput
  address: image:charts/throughput.html
  config: {title: "Throughput", caption: "Agent-steps/sec across the grid and population sweeps"}
embed_visualizations:
- name: "Grid-size scaling (interactive)"
  url: /reports/figures/runtime-and-scaling/scaling_grid.html
  description: Wall time per step vs. grid cell count (log-log). Hover for exact grid dims and ms/step.
- name: "Population scaling (interactive)"
  url: /reports/figures/runtime-and-scaling/scaling_population.html
  description: Wall time per step vs. final agent count (log-log). Hover for the initial agent count.
- name: "Duration scaling (interactive)"
  url: /reports/figures/runtime-and-scaling/scaling_duration.html
  description: Total wall time vs. step count; near-linear, with the deviation explained by population growth during longer runs.
- name: "Throughput (interactive)"
  url: /reports/figures/runtime-and-scaling/throughput.html
  description: Agent-steps/sec across the grid and population sweeps; peak ~60,000 agent-steps/sec (single-threaded, load-dependent).
runs: []
pipeline_gate:
  prerequisites: [spatial-biofilm-growth]
  enables: []
  gate_status: passed
