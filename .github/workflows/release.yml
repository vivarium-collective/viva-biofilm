# Publish viva-biofilm to PyPI via OIDC Trusted Publishing (no tokens).
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   add a "pending publisher" for the project so the first release creates it:
#     PyPI Project Name:   viva-biofilm
#     owner:               vivarium-collective
#     repository name:     viva-biofilm
#     workflow name:       release.yml
#     environment name:    pypi
#
# Then cut a GitHub Release (tag e.g. v0.1.1) — or run this workflow manually
# via "Run workflow" — and it builds per-platform wheels + an sdist and uploads
# them. viva-biofilm is a maturin/pyo3 (extension-module, no abi3) build, so
# wheels are per Python version: this matrix covers CPython 3.12 and 3.13 on
# Linux (manylinux x86_64 + aarch64) and macOS (arm64). The sdist lets any
# other platform build from source (needs a Rust toolchain).
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels (manylinux, CPython 3.12 + 3.13)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.12 python3.13 --manifest-path crates/biofilm-py/Cargo.toml
          sccache: "true"
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    # Apple Silicon only. The Intel (macos-13 / x86_64) hosted runners queue for
    # a long time; Intel-mac users install from the sdist instead. Re-add a
    # `- runner: macos-13 / target: x86_64` entry here if a prebuilt Intel-mac
    # wheel is needed.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.13
      - name: Build wheels (CPython 3.12 + 3.13)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.12 python3.13 --manifest-path crates/biofilm-py/Cargo.toml
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/biofilm-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, sdist]
    # The dedicated environment the PyPI Trusted Publisher is scoped to.
    environment:
      name: pypi
      url: https://pypi.org/project/viva-biofilm/
    permissions:
      id-token: write # OIDC token for Trusted Publishing — no API token needed.
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent re-runs: skip any file already on PyPI.
          skip-existing: true
